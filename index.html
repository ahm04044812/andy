<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 백과사전</title>
<style>
  :root {
    --bg: #f7f4ec;
    --surface: #fffdf8;
    --ink: #22201b;
    --muted: #6f695c;
    --line: #ddd6c6;
    --accent: #1f5c4d;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 8px 24px rgba(40, 30, 10, .06);
    --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --surface: #202225;
      --ink: #ece8df;
      --muted: #a09a8c;
      --line: #34373b;
      --accent: #7fcfb8;
      --accent-ink: #10201c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }

  header { padding: 48px 0 20px; text-align: center; transition: padding .25s; }
  body.has-result header { padding-top: 24px; }
  h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 4px;
    letter-spacing: -.02em;
  }
  h1 a { color: inherit; text-decoration: none; }
  .tagline { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  body.has-result .tagline { display: none; }
  body.has-result h1 { font-size: 24px; margin-bottom: 14px; }

  form {
    display: flex; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
    box-shadow: var(--shadow);
    max-width: 640px; margin: 0 auto;
  }
  form:focus-within { border-color: var(--accent); }
  input[type=search] {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    color: var(--ink); font: inherit; font-size: 17px;
  }
  input[type=search]::placeholder { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .go {
    border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 22px; font-weight: 600; white-space: nowrap;
  }
  .go:disabled { opacity: .6; cursor: progress; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px auto 0; max-width: 640px; }
  .chips:empty { display: none; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 4px 14px; font-size: 14px;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .chips-label { width: 100%; text-align: center; color: var(--muted); font-size: 13px; }

  main { padding: 16px 0 64px; }
  .status { text-align: center; color: var(--muted); padding: 48px 0; }
  .status strong { color: var(--ink); }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .entry {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .hero { display: block; width: 100%; padding: 0; border: 0; background: #0000000d; cursor: zoom-in; }
  .hero img { display: block; width: 100%; max-height: 440px; object-fit: contain; }
  .entry-body { padding: 24px clamp(18px, 4vw, 36px) 28px; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .entry h2 {
    font-family: var(--serif);
    font-size: clamp(26px, 5vw, 36px);
    line-height: 1.25; margin: 0; letter-spacing: -.02em;
    overflow-wrap: anywhere;
  }
  .desc { color: var(--muted); margin: 4px 0 0; }
  .text { margin-top: 18px; font-size: 17px; overflow-wrap: anywhere; }
  .text p { margin: 0 0 1em; }
  .more { color: var(--accent); font-weight: 600; text-decoration: none; }
  .more:hover { text-decoration: underline; }

  h3 {
    font-family: var(--serif); font-size: 19px;
    margin: 36px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .gallery button {
    padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--surface); aspect-ratio: 4 / 3; cursor: zoom-in;
  }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .related { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    background: var(--surface); color: inherit;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  .card:hover { border-color: var(--accent); }
  .card img, .card .ph {
    width: 72px; height: 72px; flex: none; border-radius: 8px; object-fit: cover;
    background: var(--line);
  }
  .card .ph { display: grid; place-items: center; font-family: var(--serif); font-size: 26px; color: var(--muted); }
  .card b { display: block; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .card span {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--muted); font-size: 14px; line-height: 1.5; margin-top: 2px;
  }

  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(0, 0, 0, .82); }
  dialog img { display: block; max-width: 96vw; max-height: 86vh; border-radius: 8px; background: #fff; }
  dialog p { color: #eee; text-align: center; margin: 8px 0 0; font-size: 14px; overflow-wrap: anywhere; }
  dialog .close {
    position: fixed; top: 12px; right: 12px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: rgba(255, 255, 255, .15); color: #fff; font-size: 22px;
  }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 0 40px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="#">그림 백과사전</a></h1>
    <p class="tagline">궁금한 단어나 문장을 입력하면 사진과 글로 알려드려요.</p>
    <form id="form" role="search">
      <input id="q" type="search" placeholder="예: 블랙홀, 무지개는 왜 생길까" autocomplete="off" aria-label="검색어" required>
      <button class="go" id="go">찾아보기</button>
    </form>
    <div class="chips" id="chips"></div>
  </header>
  <main id="out" aria-live="polite"></main>
  <footer>
    내용과 사진은 <a href="https://ko.wikipedia.org" target="_blank" rel="noopener">위키백과</a>와
    <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">위키미디어 공용</a>에서 가져옵니다 (CC BY-SA).
  </footer>
</div>

<dialog id="viewer">
  <button class="close" aria-label="닫기">×</button>
  <img alt="">
  <p></p>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const out = $('#out'), input = $('#q'), goBtn = $('#go'), chips = $('#chips'), viewer = $('#viewer');
const SUGGESTED = ['블랙홀', '훈민정음', '오로라', '공룡', '무지개는 왜 생길까'];
const LANG_NAME = { ko: '한국어', en: '영어' };
let token = 0; // 가장 최근 검색만 화면에 반영하기 위한 번호

function el(tag, props, ...kids) {
  const n = Object.assign(document.createElement(tag), props || {});
  n.append(...kids.filter((k) => k != null));
  return n;
}

async function api(lang, params) {
  const url = new URL(`https://${lang}.wikipedia.org/w/api.php`);
  url.search = new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', redirects: '1', ...params });
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// 단어·문장으로 문서를 찾고, 각 문서의 요약 글과 대표 사진을 함께 가져온다.
async function search(lang, q) {
  const data = await api(lang, {
    action: 'query', generator: 'search', gsrsearch: q, gsrlimit: '9',
    prop: 'extracts|pageimages|description|pageprops|info',
    exintro: '1', explaintext: '1', exlimit: 'max',
    piprop: 'thumbnail|name', pithumbsize: '960', pilimit: 'max',
    ppprop: 'disambiguation', inprop: 'url',
  });
  const pages = (data.query && data.query.pages) || [];
  return pages
    .filter((p) => !p.missing && !(p.pageprops && 'disambiguation' in p.pageprops))
    .sort((a, b) => a.index - b.index);
}

// 문서에 실린 다른 사진들 (아이콘·로고 같은 장식 그림은 제외)
async function gallery(lang, title) {
  const data = await api(lang, {
    action: 'query', titles: title, generator: 'images', gimlimit: '40',
    prop: 'imageinfo', iiprop: 'url|mime|size', iiurlwidth: '330',
  });
  const pages = (data.query && data.query.pages) || [];
  return pages
    .map((p) => ({ title: p.title.replace(/^[^:]+:/, '').replace(/\.\w+$/, ''), file: p.title, info: p.imageinfo && p.imageinfo[0] }))
    .filter((p) => p.info && /^image\/(jpeg|png|webp)$/.test(p.info.mime) && p.info.width >= 300 && p.info.height >= 200)
    .slice(0, 12);
}

function status(...kids) {
  out.replaceChildren(el('div', { className: 'status' }, ...kids));
}

function openViewer(src, caption) {
  viewer.querySelector('img').src = src;
  viewer.querySelector('p').textContent = caption || '';
  viewer.showModal();
}
viewer.addEventListener('click', (e) => { if (e.target.tagName !== 'IMG') viewer.close(); });

function renderEntry(page, others, lang, note) {
  const mine = token;
  const body = el('div', { className: 'entry-body' },
    note ? el('p', { className: 'note', textContent: note }) : null,
    el('h2', { textContent: page.title }),
    page.description ? el('p', { className: 'desc', textContent: page.description }) : null,
  );
  const text = el('div', { className: 'text' });
  const paras = (page.extract || '').split(/\n+/).map((s) => s.trim()).filter(Boolean);
  if (paras.length) paras.forEach((p) => text.append(el('p', { textContent: p })));
  else text.append(el('p', { textContent: '이 항목은 요약 글이 없어요. 아래 링크에서 전체 문서를 확인해 보세요.' }));
  const link = page.fullurl || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`;
  text.append(el('a', { className: 'more', href: link, target: '_blank', rel: 'noopener', textContent: '위키백과에서 전체 문서 읽기 →' }));
  body.append(text);

  const entry = el('article', { className: 'entry' });
  if (page.thumbnail) {
    const hero = el('button', { className: 'hero', type: 'button', ariaLabel: '사진 크게 보기' },
      el('img', { src: page.thumbnail.source, alt: page.title }));
    hero.onclick = () => openViewer(page.thumbnail.source, page.title);
    entry.append(hero);
  }
  entry.append(body);

  const galleryBox = el('section');
  const nodes = [entry, galleryBox];

  if (others.length) {
    const grid = el('div', { className: 'related' });
    for (const o of others) {
      const card = el('button', { className: 'card', type: 'button' },
        o.thumbnail
          ? el('img', { src: o.thumbnail.source, alt: '', loading: 'lazy' })
          : el('div', { className: 'ph', textContent: o.title.slice(0, 1) }),
        el('div', null,
          el('b', { textContent: o.title }),
          el('span', { textContent: o.description || o.extract || '' })),
      );
      card.onclick = () => {
        token++;
        input.value = o.title;
        renderEntry(o, [page, ...others.filter((x) => x !== o)], lang);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      grid.append(card);
    }
    nodes.push(el('section', null, el('h3', { textContent: '함께 보면 좋은 항목' }), grid));
  }
  out.replaceChildren(...nodes);

  gallery(lang, page.title).then((imgs) => {
    if (mine !== token) return;
    const hero = page.pageimage && page.pageimage.replace(/_/g, ' ');
    imgs = imgs.filter((i) => i.file.replace(/^[^:]+:/, '') !== hero);
    if (!imgs.length) return;
    const grid = el('div', { className: 'gallery' });
    for (const i of imgs) {
      const b = el('button', { type: 'button', title: i.title },
        el('img', { src: i.info.thumburl || i.info.url, alt: i.title, loading: 'lazy' }));
      b.onclick = () => openViewer(i.info.url, i.title);
      grid.append(b);
    }
    galleryBox.append(el('h3', { textContent: '사진 더 보기' }), grid);
  }).catch(() => {});
}

async function lookup(q) {
  q = q.trim();
  if (!q) return;
  const mine = ++token;
  document.body.classList.add('has-result');
  input.value = q;
  goBtn.disabled = true;
  status(el('div', { className: 'spinner' }), '찾아보는 중…');
  try {
    let lang = 'ko', note = null;
    let pages = await search(lang, q);
    if (!pages.length) {
      lang = 'en';
      pages = await search(lang, q);
      if (pages.length) note = `한국어 문서가 없어 ${LANG_NAME[lang]} 위키백과에서 찾았어요.`;
    }
    if (mine !== token) return;
    if (!pages.length) {
      status(el('strong', { textContent: `“${q}”` }), '에 대한 내용을 찾지 못했어요.', el('br'), '다른 단어로 바꾸거나 더 짧게 입력해 보세요.');
    } else {
      remember(q);
      renderEntry(pages[0], pages.slice(1), lang, note);
    }
  } catch (err) {
    if (mine !== token) return;
    status('내용을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
    console.error(err);
  } finally {
    if (mine === token) goBtn.disabled = false;
  }
}

// 최근 찾아본 단어 (이 브라우저에만 저장)
function recent() {
  try { return JSON.parse(localStorage.getItem('recent') || '[]'); } catch { return []; }
}
function remember(q) {
  const list = [q, ...recent().filter((x) => x !== q)].slice(0, 8);
  try { localStorage.setItem('recent', JSON.stringify(list)); } catch {}
  renderChips();
}
function renderChips() {
  const mine = recent();
  const list = mine.length ? mine : SUGGESTED;
  chips.replaceChildren(
    el('div', { className: 'chips-label', textContent: mine.length ? '최근 찾아본 항목' : '이런 걸 찾아보세요' }),
    ...list.map((t) => {
      const b = el('button', { className: 'chip', type: 'button', textContent: t });
      b.onclick = () => go(t);
      return b;
    }));
}

// 주소(#검색어)에 검색어를 담아 뒤로 가기와 링크 공유가 되게 한다.
function go(q) {
  const hash = '#' + encodeURIComponent(q.trim());
  if (location.hash === hash) lookup(q); else location.hash = hash;
}
function fromHash() {
  let q = '';
  try { q = decodeURIComponent(location.hash.slice(1)); } catch {}
  if (q) lookup(q);
  else {
    token++;
    document.body.classList.remove('has-result');
    out.replaceChildren();
    input.value = '';
    goBtn.disabled = false;
  }
}

$('#form').addEventListener('submit', (e) => { e.preventDefault(); go(input.value); });
window.addEventListener('hashchange', fromHash);
renderChips();
fromHash();
</script>
</body>
</html>
