<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 아이패드·아이폰에서 홈 화면에 추가하면 앱처럼 전체 화면으로 열린다 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사진 백과">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>사진 백과사전</title>
<style>
  :root {
    --bg: #f7f4ec;
    --surface: #fffdf8;
    --ink: #22201b;
    --muted: #6f695c;
    --line: #ddd6c6;
    --accent: #1f5c4d;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(40, 30, 10, .06), 0 8px 24px rgba(40, 30, 10, .06);
    --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --surface: #202225;
      --ink: #ece8df;
      --muted: #a09a8c;
      --line: #34373b;
      --accent: #7fcfb8;
      --accent-ink: #10201c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 920px; margin: 0 auto;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header { padding: 48px 0 20px; text-align: center; transition: padding .25s; }
  body.has-result header { padding-top: 24px; }
  h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 4px;
    letter-spacing: -.02em;
  }
  h1 a { color: inherit; text-decoration: none; }
  .tagline { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  body.has-result .tagline { display: none; }
  body.has-result h1 { font-size: 24px; margin-bottom: 14px; }

  form {
    display: flex; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
    box-shadow: var(--shadow);
    max-width: 640px; margin: 0 auto;
  }
  form:focus-within { border-color: var(--accent); }
  input[type=search] {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    color: var(--ink); font: inherit; font-size: 17px;
  }
  input[type=search]::placeholder { color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .go {
    border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 22px; font-weight: 600; white-space: nowrap;
  }
  .go:disabled { opacity: .6; cursor: progress; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px auto 0; max-width: 640px; }
  .chips:empty { display: none; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 4px 14px; font-size: 14px;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .chips-label { width: 100%; text-align: center; color: var(--muted); font-size: 13px; }

  main { padding: 16px 0 64px; }
  .status { text-align: center; color: var(--muted); padding: 48px 0; }
  .status strong { color: var(--ink); }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .entry {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .hero { display: block; width: 100%; padding: 0; border: 0; background: #0000000d; cursor: zoom-in; }
  .hero img { display: block; width: 100%; max-height: 440px; object-fit: contain; }
  .entry-body { padding: 24px clamp(18px, 4vw, 36px) 28px; }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  .entry h2 {
    font-family: var(--serif);
    font-size: clamp(26px, 5vw, 36px);
    line-height: 1.25; margin: 0; letter-spacing: -.02em;
    overflow-wrap: anywhere;
  }
  .desc { color: var(--muted); margin: 4px 0 0; }
  .text { margin-top: 18px; font-size: 17px; overflow-wrap: anywhere; }
  .text p { margin: 0 0 1em; }
  .more { color: var(--accent); font-weight: 600; text-decoration: none; }
  .more:hover { text-decoration: underline; }

  h3 {
    font-family: var(--serif); font-size: 19px;
    margin: 36px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .gallery button {
    padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--surface); aspect-ratio: 4 / 3; cursor: zoom-in;
  }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .related { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    background: var(--surface); color: inherit;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  .card:hover { border-color: var(--accent); }
  .card img, .card .ph {
    width: 72px; height: 72px; flex: none; border-radius: 8px; object-fit: cover;
    background: var(--line);
  }
  .card .ph { display: grid; place-items: center; font-family: var(--serif); font-size: 26px; color: var(--muted); }
  .card b { display: block; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
  .card span {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--muted); font-size: 14px; line-height: 1.5; margin-top: 2px;
  }

  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(0, 0, 0, .82); }
  dialog img { display: block; max-width: 96vw; max-height: 86vh; border-radius: 8px; background: #fff; }
  dialog p { color: #eee; text-align: center; margin: 8px 0 0; font-size: 14px; overflow-wrap: anywhere; }
  dialog .close {
    position: fixed; top: 12px; right: 12px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: rgba(255, 255, 255, .15); color: #fff; font-size: 22px;
  }

  .hero { position: relative; }
  .hero .badge {
    position: absolute; left: 12px; bottom: 10px;
    background: rgba(0, 0, 0, .6); color: #fff; font-size: 12px;
    border-radius: 6px; padding: 2px 8px;
  }
  .hero-wait {
    aspect-ratio: 16 / 9; max-height: 440px; width: 100%;
    display: grid; place-content: center; justify-items: center; gap: 10px;
    background: #0000000d; color: var(--muted); font-size: 14px; text-align: center; padding: 16px;
  }
  .hero-wait .spinner { margin: 0; }
  .linkish { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; text-decoration: underline; }

  .settings-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 4px 14px; font-size: 13px; margin-top: 14px;
  }
  #settings { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 22px; width: min(440px, 92vw); }
  #settings h2 { margin: 0 0 6px; font-size: 19px; font-family: var(--serif); }
  #settings p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  #settings label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  #settings input {
    width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  #settings .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  #settings .row button { border-radius: 8px; padding: 8px 16px; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  #settings .row .go { border: 0; }

  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 0 40px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="#">사진 백과사전</a></h1>
    <p class="tagline">궁금한 단어나 문장을 입력하면 사진과 글로 알려드려요.</p>
    <form id="form" role="search">
      <input id="q" type="search" placeholder="예: 블랙홀, 무지개는 왜 생길까" autocomplete="off" aria-label="검색어" required>
      <button class="go" id="go">찾아보기</button>
    </form>
    <div class="chips" id="chips"></div>
    <button class="settings-btn" id="openSettings" type="button">⚙ 사진 생성 설정 (Gemini)</button>
  </header>
  <main id="out" aria-live="polite"></main>
  <footer>
    내용과 사진은 <a href="https://ko.wikipedia.org" target="_blank" rel="noopener">위키백과</a>와
    <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">위키미디어 공용</a>에서 가져옵니다 (CC BY-SA).
    맨 위 사진은 Google Gemini가 만든 AI 생성 사진이에요.
  </footer>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>사진 생성 설정</h2>
    <p>Gemini API 키를 넣으면 검색할 때마다 사진처럼 보이는 이미지를 만들어 보여줘요.
      키는 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 받을 수 있어요.
      키는 이 브라우저에만 저장되고 Google 말고는 어디에도 보내지 않아요.</p>
    <label for="apiKey">Gemini API 키</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
    <label for="model">이미지 모델</label>
    <input id="model" type="text" autocomplete="off">
    <div class="row">
      <button type="button" id="clearKey">키 지우기</button>
      <button class="go" value="save">저장</button>
    </div>
  </form>
</dialog>

<dialog id="viewer">
  <button class="close" aria-label="닫기">×</button>
  <img alt="">
  <p></p>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const out = $('#out'), input = $('#q'), goBtn = $('#go'), chips = $('#chips'), viewer = $('#viewer');
const SUGGESTED = ['블랙홀', '훈민정음', '오로라', '공룡', '무지개는 왜 생길까'];
const LANG_NAME = { ko: '한국어', en: '영어' };
let token = 0; // 가장 최근 검색만 화면에 반영하기 위한 번호

function el(tag, props, ...kids) {
  const n = Object.assign(document.createElement(tag), props || {});
  n.append(...kids.filter((k) => k != null));
  return n;
}

async function api(lang, params) {
  const url = new URL(`https://${lang}.wikipedia.org/w/api.php`);
  url.search = new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', redirects: '1', ...params });
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// 단어·문장으로 문서를 찾고, 각 문서의 요약 글과 대표 사진을 함께 가져온다.
async function search(lang, q) {
  const data = await api(lang, {
    action: 'query', generator: 'search', gsrsearch: q, gsrlimit: '9',
    prop: 'extracts|pageimages|description|pageprops|info',
    exintro: '1', explaintext: '1', exlimit: 'max',
    piprop: 'thumbnail|name', pithumbsize: '960', pilimit: 'max',
    ppprop: 'disambiguation', inprop: 'url',
  });
  const pages = (data.query && data.query.pages) || [];
  return pages
    .filter((p) => !p.missing && !(p.pageprops && 'disambiguation' in p.pageprops))
    .sort((a, b) => a.index - b.index);
}

// 문서에 실린 다른 사진들 (아이콘·로고 같은 장식 그림은 제외)
async function gallery(lang, title) {
  const data = await api(lang, {
    action: 'query', titles: title, generator: 'images', gimlimit: '40',
    prop: 'imageinfo', iiprop: 'url|mime|size', iiurlwidth: '330',
  });
  const pages = (data.query && data.query.pages) || [];
  return pages
    .map((p) => ({ title: p.title.replace(/^[^:]+:/, '').replace(/\.\w+$/, ''), file: p.title, info: p.imageinfo && p.imageinfo[0] }))
    .filter((p) => p.info && /^image\/(jpeg|png|webp)$/.test(p.info.mime) && p.info.width >= 300 && p.info.height >= 200)
    .slice(0, 12);
}

function status(...kids) {
  out.replaceChildren(el('div', { className: 'status' }, ...kids));
}

function openViewer(src, caption) {
  viewer.querySelector('img').src = src;
  viewer.querySelector('p').textContent = caption || '';
  viewer.showModal();
}
viewer.addEventListener('click', (e) => { if (e.target.tagName !== 'IMG') viewer.close(); });

function renderEntry(page, others, lang, note, photo) {
  const mine = token;
  const body = el('div', { className: 'entry-body' },
    note ? el('p', { className: 'note', textContent: note }) : null,
    el('h2', { textContent: page.title }),
    page.description ? el('p', { className: 'desc', textContent: page.description }) : null,
  );
  const text = el('div', { className: 'text' });
  const paras = (page.extract || '').split(/\n+/).map((s) => s.trim()).filter(Boolean);
  if (paras.length) paras.forEach((p) => text.append(el('p', { textContent: p })));
  else text.append(el('p', { textContent: '이 항목은 요약 글이 없어요. 아래 링크에서 전체 문서를 확인해 보세요.' }));
  const link = page.fullurl || `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(page.title)}`;
  text.append(el('a', { className: 'more', href: link, target: '_blank', rel: 'noopener', textContent: '위키백과에서 전체 문서 읽기 →' }));
  body.append(text);

  const entry = el('article', { className: 'entry' });
  const heroSlot = el('div');
  entry.append(heroSlot, body);
  const showHero = (src, label, caption) => {
    const hero = el('button', { className: 'hero', type: 'button', ariaLabel: '사진 크게 보기' },
      el('img', { src, alt: page.title }),
      label ? el('span', { className: 'badge', textContent: label }) : null);
    hero.onclick = () => openViewer(src, caption || page.title);
    heroSlot.replaceChildren(hero);
  };
  const showWikiHero = () => {
    if (page.thumbnail) showHero(page.thumbnail.source, '위키백과 사진');
    else heroSlot.replaceChildren();
  };
  const heroMessage = (...kids) => heroSlot.replaceChildren(el('div', { className: 'hero-wait' }, ...kids));

  if (!photo) {
    showWikiHero();
  } else {
    // 사진이 오기 전까지 위키백과 사진을 먼저 보여 준다
    if (page.thumbnail) {
      showWikiHero();
      heroSlot.querySelector('.badge').textContent = 'Gemini 사진 만드는 중…';
    } else {
      heroMessage(el('div', { className: 'spinner' }), 'Gemini가 사진을 만드는 중…');
    }
    photo.then((src) => {
      if (mine !== token) return;
      showHero(src, 'AI 생성 사진 · Gemini', `${page.title} (AI 생성 사진)`);
    }).catch((err) => {
      if (mine !== token) return;
      console.error(err);
      const retry = el('button', { className: 'linkish', type: 'button', textContent: '설정 확인' });
      retry.onclick = () => openSettings();
      if (page.thumbnail) {
        showWikiHero();
        heroSlot.append(el('p', { className: 'note', style: 'padding:8px 16px 0' }, `사진을 만들지 못했어요: ${err.message} `, retry));
      } else {
        heroMessage(`사진을 만들지 못했어요: ${err.message}`, retry);
      }
    });
  }

  const galleryBox = el('section');
  const nodes = [entry, galleryBox];

  if (others.length) {
    const grid = el('div', { className: 'related' });
    for (const o of others) {
      const card = el('button', { className: 'card', type: 'button' },
        o.thumbnail
          ? el('img', { src: o.thumbnail.source, alt: '', loading: 'lazy' })
          : el('div', { className: 'ph', textContent: o.title.slice(0, 1) }),
        el('div', null,
          el('b', { textContent: o.title }),
          el('span', { textContent: o.description || o.extract || '' })),
      );
      card.onclick = () => {
        token++;
        input.value = o.title;
        renderEntry(o, [page, ...others.filter((x) => x !== o)], lang, null,
          settings().key ? makePhoto(o.title, o.description) : null);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      grid.append(card);
    }
    nodes.push(el('section', null, el('h3', { textContent: '함께 보면 좋은 항목' }), grid));
  }
  out.replaceChildren(...nodes);

  gallery(lang, page.title).then((imgs) => {
    if (mine !== token) return;
    const hero = !photo && page.pageimage && page.pageimage.replace(/_/g, ' ');
    imgs = imgs.filter((i) => i.file.replace(/^[^:]+:/, '') !== hero);
    if (!imgs.length) return;
    const grid = el('div', { className: 'gallery' });
    for (const i of imgs) {
      const b = el('button', { type: 'button', title: i.title },
        el('img', { src: i.info.thumburl || i.info.url, alt: i.title, loading: 'lazy' }));
      b.onclick = () => openViewer(i.info.url, i.title);
      grid.append(b);
    }
    galleryBox.append(el('h3', { textContent: '실제 사진 더 보기' }), grid);
  }).catch(() => {});
}

async function lookup(q) {
  q = q.trim();
  if (!q) return;
  const mine = ++token;
  document.body.classList.add('has-result');
  input.value = q;
  goBtn.disabled = true;
  status(el('div', { className: 'spinner' }), '찾아보는 중…');
  // 사진 생성은 위키백과 검색을 기다리지 않고 바로 시작한다
  const photo = settings().key ? makePhoto(q) : null;
  if (photo) photo.catch(() => {});
  try {
    let lang = 'ko', note = null;
    let pages = await search(lang, q);
    if (!pages.length) {
      lang = 'en';
      pages = await search(lang, q);
      if (pages.length) note = `한국어 문서가 없어 ${LANG_NAME[lang]} 위키백과에서 찾았어요.`;
    }
    if (mine !== token) return;
    if (!pages.length) {
      status(el('strong', { textContent: `“${q}”` }), '에 대한 내용을 찾지 못했어요.', el('br'), '다른 단어로 바꾸거나 더 짧게 입력해 보세요.');
    } else {
      remember(q);
      renderEntry(pages[0], pages.slice(1), lang, note, photo);
    }
  } catch (err) {
    if (mine !== token) return;
    status('내용을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
    console.error(err);
  } finally {
    if (mine === token) goBtn.disabled = false;
  }
}

// ---- Gemini 사진 생성 ----
// 가장 저렴한 모델부터 쓰고, 이 키로 쓸 수 없으면 다음으로 저렴한 모델로 넘어간다
// (Flash-Lite → 2.5 Flash 약 $0.039/장 → 3.1 Flash 약 $0.045~/장)
const DEFAULT_MODEL = 'gemini-3.1-flash-lite-image';
const FALLBACK_MODELS = ['gemini-2.5-flash-image', 'gemini-3.1-flash-image'];
const photoCache = new Map(); // 같은 항목은 다시 만들지 않는다 (요금 절약)
let workingModel = null;

function settings() {
  let key = '', model = '';
  try { key = localStorage.getItem('geminiKey') || ''; model = localStorage.getItem('geminiModel') || ''; } catch {}
  // 예전 기본값(gemini-2.5-flash-image)으로 저장된 설정은 새 기본값으로 올린다
  if (model === 'gemini-2.5-flash-image') model = '';
  return { key, model: model || DEFAULT_MODEL };
}

function photoPrompt(subject, hint) {
  return [
    `Photorealistic encyclopedia photograph of: ${subject}.`,
    hint ? `(${hint})` : '',
    'If it is a question or abstract idea, show a real scene that explains it.',
    'Natural light, sharp focus, realistic detail, 16:9. No text, labels or watermarks.',
  ].filter(Boolean).join(' ');
}

// 같은 주제를 동시에 두 번 요청하지 않도록 진행 중인 요청 자체를 저장한다
function makePhoto(subject, hint) {
  const { key, model } = settings();
  const cacheKey = model + '|' + subject;
  if (!photoCache.has(cacheKey)) {
    const p = generatePhoto(key, model, photoPrompt(subject, hint));
    p.catch(() => photoCache.delete(cacheKey));
    photoCache.set(cacheKey, p);
  }
  return photoCache.get(cacheKey);
}

async function generatePhoto(key, model, prompt) {
  const chain = model === DEFAULT_MODEL ? [workingModel || DEFAULT_MODEL, ...FALLBACK_MODELS] : [model];
  for (const m of [...new Set(chain)]) {
    try {
      const src = await callGemini(key, m, prompt);
      workingModel = m;
      return src;
    } catch (err) {
      if (!err.notFound || m === chain[chain.length - 1]) throw err;
    }
  }
}

async function callGemini(key, model, prompt) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseModalities: ['IMAGE'], imageConfig: { aspectRatio: '16:9' } },
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = (data.error && data.error.message) || 'HTTP ' + res.status;
    if (res.status === 400 && /api key/i.test(msg)) throw new Error('API 키가 올바르지 않아요');
    if (res.status === 403) throw new Error('이 API 키로는 사용할 수 없어요');
    if (res.status === 404) throw Object.assign(new Error(`"${model}" 모델을 찾을 수 없어요`), { notFound: true });
    if (res.status === 429) throw new Error('사용 한도를 넘었어요. 잠시 뒤 다시 시도해 주세요');
    throw new Error(msg);
  }
  const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const img = parts.find((p) => p.inlineData && p.inlineData.data);
  if (!img) throw new Error('이 주제로는 사진이 만들어지지 않았어요');
  return `data:${img.inlineData.mimeType || 'image/png'};base64,${img.inlineData.data}`;
}

function openSettings() {
  const s = settings();
  $('#apiKey').value = s.key;
  $('#model').value = s.model;
  $('#settings').showModal();
}
$('#openSettings').onclick = openSettings;
$('#clearKey').onclick = () => {
  try { localStorage.removeItem('geminiKey'); } catch {}
  $('#apiKey').value = '';
};
$('#settingsForm').addEventListener('submit', () => {
  try {
    localStorage.setItem('geminiKey', $('#apiKey').value.trim());
    localStorage.setItem('geminiModel', $('#model').value.trim() || DEFAULT_MODEL);
  } catch {}
  const q = input.value.trim();
  if (q && document.body.classList.contains('has-result')) lookup(q);
});

// 최근 찾아본 단어 (이 브라우저에만 저장)
function recent() {
  try { return JSON.parse(localStorage.getItem('recent') || '[]'); } catch { return []; }
}
function remember(q) {
  const list = [q, ...recent().filter((x) => x !== q)].slice(0, 8);
  try { localStorage.setItem('recent', JSON.stringify(list)); } catch {}
  renderChips();
}
function renderChips() {
  const mine = recent();
  const list = mine.length ? mine : SUGGESTED;
  chips.replaceChildren(
    el('div', { className: 'chips-label', textContent: mine.length ? '최근 찾아본 항목' : '이런 걸 찾아보세요' }),
    ...list.map((t) => {
      const b = el('button', { className: 'chip', type: 'button', textContent: t });
      b.onclick = () => go(t);
      return b;
    }));
}

// 주소(#검색어)에 검색어를 담아 뒤로 가기와 링크 공유가 되게 한다.
function go(q) {
  const hash = '#' + encodeURIComponent(q.trim());
  if (location.hash === hash) lookup(q); else location.hash = hash;
}
function fromHash() {
  let q = '';
  try { q = decodeURIComponent(location.hash.slice(1)); } catch {}
  if (q) lookup(q);
  else {
    token++;
    document.body.classList.remove('has-result');
    out.replaceChildren();
    input.value = '';
    goBtn.disabled = false;
  }
}

$('#form').addEventListener('submit', (e) => { e.preventDefault(); go(input.value); });
window.addEventListener('hashchange', fromHash);
renderChips();
fromHash();
</script>
